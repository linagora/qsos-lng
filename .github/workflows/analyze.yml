name: Analyze Project

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'GitHub project to analyze (format: owner/repo)'
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read
      checks: read
      statuses: read

    steps:
      - name: Checkout qsos-lng
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Install dependencies
        run: go mod download

      - name: Run analysis
        env:
          GITHUB_TOKEN: ${{ secrets.ANALYSIS_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          echo "Analyzing project: ${{ inputs.project }}"
          go run . analyze ${{ inputs.project }}
